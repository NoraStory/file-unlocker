# 为 GitHub Release 中的真实产物（NSIS 安装包 / 便携版 exe）生成 SLSA Level 3 provenance。
# 触发时机：release 发布时。注意需先把产物作为 release assets 上传（如 gh release create v0.3.2 <files>），
# 本 workflow 会直接下载该 release 的全部 .exe 资产并计算 sha256。
# 验证方式：https://github.com/slsa-framework/slsa-verifier

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          mkdir -p artifacts
          gh release download "$tag" --pattern "*.exe" --dir artifacts --clobber
          ls -la artifacts

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          cd artifacts
          files=$(ls)
          if [ -z "$files" ]; then
            echo "release 中没有 .exe 资产，无法生成 provenance" >&2
            exit 1
          fi
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
